ação","url":"https://www2.camara.leg.br/legin/fed/lei/2026/lei-15388-14-abril-2026-798950-normaatualizada-pl.html"},{"name":"Lei nº 13.005/2014 — PNE anterior (vigência estendida até 31/12/2025)","url":"https://www2.camara.leg.br/legin/fed/lei/2014/lei-13005-25-junho-2014-778970-normaatualizada-pl.html"},{"name":"Lei nº 1.664/2006 — Plano de Cargos e Salários de Marapanim","url":"https://marapanim.pa.gov.br/wp-content/uploads/2022/05/LEI-1.664-2006-PCS.pdf"},{"name":"Portal oficial da Prefeitura — legislação e novas publicações","url":"https://marapanim.pa.gov.br/"},{"name":"Lei nº 15.100/2025 — aparelhos eletrônicos na escola","url":"https://normas.leg.br/?urn=urn:lex:br:federal:lei:2025-01-13;15100"},{"name":"Lei nº 15.211/2025 — ECA Digital","url":"https://normas.leg.br/?urn=urn:lex:br:federal:lei:2025-09-17;15211"}],"practice":{"PORT-01":"Escolha um parágrafo de uma questão anterior. Sublinhe as informações explícitas e indique qual trecho sustenta cada inferência.","PORT-02":"Troque uma palavra do enunciado por um sinônimo. Explique se o sentido e o tom do texto se mantêm.","PORT-03":"Reescreva duas frases mantendo a relação de sentido entre elas. Identifique a expressão que garante essa relação.","PORT-04":"Separe três exemplos e um contraexemplo da regra estudada. Justifique a grafia de cada palavra.","PORT-05":"Analise a mesma palavra em duas frases. Identifique sua formação e verifique se a classe gramatical muda pelo contexto.","PORT-06":"Marque os verbos da frase, separe as orações e explique a função sintática de cada termo relevante.","PORT-07":"Crie duas frases com o mesmo verbo ou nome regente. Justifique a concordância, a preposição e o emprego de crase quando couber.","PORT-08":"Reescreva um aviso escolar para outro destinatário. Compare tratamento, clareza e nível de formalidade.","INFO":"Reproduza uma operação da aula em um exemplo de rotina escolar. Anote os passos e o resultado que permitiria reconhecer a resposta correta em uma prova.","RL":"Escreva as hipóteses antes de resolver. Teste a conclusão com um contraexemplo, uma tabela ou um pequeno diagrama.","MAT":"Resolva um exemplo sem consultar a aula e explique a um aluno dos anos finais por que o procedimento funciona. Registre uma condição em que ele deixaria de valer.","MAT-11":"Antes de calcular, decida se a ordem altera o resultado e se há repetição. Confirme o princípio com uma contagem pequena feita à mão.","MAT-12":"Defina o espaço amostral e o evento. Verifique a equiprobabilidade e diga o que mudaria se o sorteio fosse sem reposição.","MAT-13":"Monte um conjunto pequeno de dados, calcule a medida estudada e interprete o resultado. Investigue o efeito de acrescentar um valor extremo.","MAT-20":"Faça o esboço antes de escrever as equações. Substitua as coordenadas de um ponto para conferir a resposta.","MAT-23":"Organize a contribuição histórica em três partes: problema original, ideia matemática e possibilidade de uso em sala.","PED":"Aplique o conceito da aula a uma turma de 7º ano com diferentes níveis de aprendizagem. Descreva uma intervenção e o que observaria para avaliar seu efeito.","LEG":"Localize na norma indicada quem tem o dever, quem tem o direito e em quais condições a regra se aplica. Confira a redação vigente antes de memorizar prazos.","LOC":"Compare a informação da aula com uma fonte sobre Marapanim. Registre o ano do dado e diferencie o que vale para o município do que vale para o Pará.","ET":"Prepare uma pequena amostra do que o item pede. Revise o resultado pelos critérios do edital que você estiver utilizando.","EST":"Aplique o procedimento a um tópico estudado nesta semana e registre o resultado nas anotações.","REV":"Resolva uma questão de cada assunto listado sem consulta. Anote o primeiro passo que causou dificuldade e volte ao módulo correspondente.","EDT":"Quando houver publicação oficial, registre o documento, a data e a página que comprovam esta conferência."}}</script><script>const {items,docs,practice}=JSON.parse(document.querySelector('#data').textContent);
const $=s=>document.querySelector(s), main=$('#main'), query=$('#query');

function listHead(k,t,p){return '<div class="kicker eyeline">'+k+'</div><h1>'+esc(t)+'</h1><p class="mut">'+p+'</p>'}
function area(g){let a=sel(g),codes=[...new Set(a.map(i=>i.code))];main.innerHTML=listHead('Programa de estudos',labels[g][0],codes.length+' módulos · '+a.length+' itens · '+done(a)+' assistidos')+'<div class="tools"><label class="inline"><input type="checkbox" id="pending"> Mostrar apenas pendentes</label></div><div id="modules"></div>';function fill(){let arr=a.filter(i=>!$('#pending').checked||!state.done[i.id]);$('#modules').innerHTML=codes.map((c,k)=>{let b=arr.filter(i=>i.code===c);return b.length?'<details class="group" '+(k===0?'open':'')+'><summary>'+esc(b[0].module)+' <small>· '+c+' · '+b.length+'</small></summary>'+b.map(row).join('')+'</details>':''}).join('')||'<p>Você concluiu todos os itens desta área.</p>'}$('#pending').onchange=fill;fill()}
function showLesson(a){const g=group(a);state.last=a.id;save();main.innerHTML='<a href="#area-'+g+'">← '+esc(labels[g][0])+'</a><div class="kicker eyeline sp">'+(g==='EDT'?'Tarefa':'Aula')+' '+num(a.id)+' de 470 · '+a.code+'</div><h1 class="lesson-title">'+esc(plain(a.topic))+'</h1><p class="mut">'+esc(a.module)+(a.priority?' &nbsp; <span class="tag">Prioridade '+esc(a.priority)+'</span>':'')+'</p><div class="tools"><button class="btn primary" id="watched"></button><a class="btn" href="'+yt(a)+'" target="_blank" rel="noopener">Abrir no YouTube ↗</a></div><div class="player"><iframe title="'+esc(a.title)+'" src="https://www.youtube-nocookie.com/embed/'+a.video+'" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="lessonmeta"><strong>'+esc(a.title)+'</strong><div class="hint">'+esc(a.channel||'YouTube')+' · Vídeo externo</div></div>'+(a.note?'<div class="panel"><strong>Como usar este vídeo</strong><p>'+esc(a.note)+'</p></div>':'')+(a.refs?.length?'<div class="panel"><h2>Leitura de apoio</h2>'+a.refs.map(x=>'<p><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+' ↗</a></p>').join('')+'</div>':'')+'<div class="panel"><h2>Prática para a prova</h2><p>'+esc(practice[a.code]||practice[g])+'</p></div><div class="panel"><h2><label for="notes">Minhas anotações</label></h2><textarea id="notes" rows="4" placeholder="Registre uma definição, uma questão que errou ou um ponto para revisar."></textarea><small id="saved" class="hint" role="status">As anotações e o progresso ficam neste navegador.</small></div><div class="lessonnav">'+(a.id>1?'<a class="btn" href="'+lesson(a.id-1)+'">← Anterior</a>':'<span></span>')+(a.id<470?'<a class="btn" href="'+lesson(a.id+1)+'">Próxima →</a>':'<a class="btn" href="#inicio">Voltar ao painel</a>')+'</div>';let toggle=$('#watched');function status(){toggle.textContent=state.done[a.id]?'✓ Assistida · desmarcar':'Marcar como assistida';toggle.setAttribute('aria-pressed',!!state.done[a.id])}toggle.onclick=()=>{state.done[a.id]=!state.done[a.id];if(!save())$('#saved').textContent='O navegador bloqueou o salvamento do progresso.';status()};status();$('#notes').value=state.notes[a.id]||'';$('#notes').oninput=e=>{state.notes[a.id]=e.target.value;$('#saved').textContent=save()?'Anotação salva neste navegador.':'O navegador bloqueou o salvamento desta anotação.'}}
function sources(){main.innerHTML=listHead('Referências','Fontes e agradecimentos','Programa preventivo de 6 de novembro de 2026, baseado no concurso histórico de Marapanim e em editais correlatos. A publicação do próximo edital oficial orientará a atualização dos itens.')+'<div class="section"><h2>Fontes do programa</h2></div><div class="tablewrap"><table><thead><tr><th>Documento</th><th>Consulta</th></tr></thead><tbody>'+docs.map(d=>'<tr><td>'+esc(d.name)+'</td><td><a href="'+esc(d.url)+'" target="_blank" rel="noopener">Abrir ↗</a></td></tr>').join('')+'</tbody></table></div><div class="panel"><h2>Agradecimentos</h2><p>Aos professores, instituições e canais que disponibilizaram suas aulas no YouTube. Cada vídeo mantém o crédito ao autor e o link para a publicação original.</p></div><div class="section"><h2>Créditos das videoaulas</h2></div><input type="search" id="sourcefilter" aria-label="Filtrar créditos" placeholder="Filtrar por aula, título ou canal"><div class="tablewrap sp"><table><thead><tr><th>Aula</th><th>Vídeo</th><th>Canal</th></tr></thead><tbody id="credits"></tbody></table></div>';function filter(){let q=norm($('#sourcefilter').value);$('#credits').innerHTML=items.filter(a=>norm(num(a.id)+' '+a.title+' '+a.channel).includes(q)).map(a=>'<tr><td><a href="'+lesson(a.id)+'">'+num(a.id)+'</a></td><td><a href="'+yt(a)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></td><td>'+esc(a.channel||'Consultar no YouTube')+'</td></tr>').join('')||'<tr><td colspan="3">Nenhum crédito encontrado.</td></tr>'}$('#sourcefilter').oninput=filter;filter()}
function search(q){let terms=norm(q.trim()).split(/\s+/);let arr=items.filter(a=>terms.every(t=>norm(num(a.id)+' '+a.topic+' '+a.code+' '+a.module+' '+labels[group(a)][0]).includes(t)));main.innerHTML=listHead('Busca no programa','Resultados da busca',arr.length+' itens encontrados.')+arr.map(row).join('')}
function render(){menu(false);let h=location.hash.slice(1)||'inicio',a=items[Number(h.match(/^aula-(\d+)$/)?.[1])-1],g=h.slice(5);query.value='';nav(a?'area-'+group(a):h);if(a)showLesson(a);else if(h.startsWith('area-')&&groups.includes(g))area(g);else if(h==='fontes')sources();else if(h==='assistidas'){let arr=items.filter(i=>state.done[i.id]);main.innerHTML=listHead('Meu progresso','Aulas assistidas',arr.length?arr.length+(arr.length===1?' item marcado.':' itens marcados.'):'As aulas que você marcar como assistidas aparecerão aqui.')+arr.map(row).join('')}else if(h.startsWith('busca=')){try{query.value=decodeURIComponent(h.slice(6))}catch{}search(query.value)}else home();document.title=(main.querySelector('h1')?.textContent||'Painel')+' · Atlas Marapanim';window.scrollTo(0,0)}
query.oninput=()=>{let q=query.value;history.replaceState(null,'',q?'#busca='+encodeURIComponent(q):'#inicio');nav(q?'':'inicio');q?search(q):home();window.scrollTo(0,0)};
document.addEventListener('click',e=>{if(e.target.closest('nav a'))menu(false)});window.addEventListener('hashchange',render);prefs();render();
</script></body></html>
